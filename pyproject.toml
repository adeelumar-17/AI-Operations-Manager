[project]
name = "officehub-vercel-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pgvector>=0.3,<1",
  "langchain-core==1.6.3",
  "langchain-groq==1.1.3",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "apscheduler>=3.10,<4",
  "onnxruntime>=1.20,<2",
  "numpy>=2,<3",
  "tokenizers>=0.21,<0.24",
  "huggingface-hub>=0.30,<2",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python -m scripts.prepare_vercel_model"
